name: Deploy Preview to GitHub Pages

on:
  push:
    branches: [ main ]

# Grant permissions to allow GitHub Actions to write the built site to GitHub Pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repository Matrix
      uses: actions/checkout@v4

    - name: Initialize Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Project Dependencies
      run: npm install --legacy-peer-deps

    - name: Install esbuild Dependency
      run: npm install esbuild --save-dev

    - name: Execute Production Build
      run: npm run build

    - name: Deploy Payload to GitHub Pages Branch
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: dist # Vite outputs production files into the 'dist' folder
        branch: gh-pages # Automatically deploys to a safe tracking branch