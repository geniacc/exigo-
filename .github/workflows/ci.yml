name: Deploy Preview to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repository Matrix
      uses: actions/checkout@v4

    - name: Initialize Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Project Dependencies
      run: npm install --legacy-peer-deps

    - name: Install esbuild Dependency
      run: npm install esbuild --save-dev

    - name: Grant Executive Binaries Permissions
      # This layer gives Linux permission to run Vite before building
      run: chmod +x node_modules/.bin/vite

    - name: Execute Production Build
      run: npm run build

    - name: Deploy Payload to GitHub Pages Branch
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: dist
        branch: gh-pages